# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json

# Generated by YASB GUI v0.0.7
# Last edited: Oct 15, 2026 14:18
# https://github.com/amnweb/yasb-gui

watch_stylesheet: true
watch_config: true
debug: true
update_check: true
bars:
  primary-bar:
    enabled: true
    screens: ["*"]       # Display on all available monitors
    class_name: "yasb-bar"
    style: "adaptive"    # Enables rounded island/pill styling from CSS
    # Bar Alignment & Position
    alignment:
      position: "top"
      align: "center"

    # Smooth Appearance Animations
    animation:
      enabled: true
      duration: 200      # Animation speed in milliseconds
    # Background Blur Effects
    blur_effect:
      enabled: false
      dark_mode: false
      round_corners: false
    window_flags:
      always_on_top: true
      windows_app_bar: true # Reserves desktop space so windows don't overlap
      auto_hide: false

    # Sizing & Outer Padding
    dimensions:
      width: "100%"
      height: 36
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0

    # Widget Placement Order
    widgets:
      left:
        - glazewm_workspaces
      center:
        - taskbar
      right:
        - audio_visualizer
        - systray
        - open_meteo
        - wallpapers
        - battery
        - volume
        - clock
        - power_menu

# ==============================================================================
# WIDGET CONFIGURATIONS
# ==============================================================================
widgets:

  # --- Wallpaper Selector Widget ---
  wallpapers:
    type: "yasb.wallpapers.WallpapersWidget"
    options:
      label: "<span>\uE7AA</span>"
      image_path: "C:/Users/Startklar!/Wallpapers"
      engine:
        enabled: true
        animation: "split"
      gallery:
        type: "strip"
        image_width: 240
        accent_color: "#fff"
        orientation: "portrait"
        image_corner_radius: 0
      keybindings:
        - keys: "alt+e"
          action: "toggle_gallery"
          screen: "cursor"

  # --- Taskbar / Running Apps Widget ---
  taskbar:
    type: "yasb.taskbar.TaskbarWidget"
    options:
      icon_size: 16
      tooltip: true
      show_only_visible: true
      strict_filtering: true
      monitor_exclusive: true
      hide_empty: true
      grouping:
        enabled: true
        show_count: false
      animation:
        enabled: true
        duration: 200
      preview:
        enabled: true
        width: 180
        delay: 400
        padding: 8
        margin: 8
        blur: true
        peek: true
      title_label:
        enabled: false

  # --- Audio Visualizer Widget ---
  audio_visualizer:
    type: "yasb.audio_visualizer.AudioVisualizerWidget"
    options:
      edge_fade: 0
      mirror: true
      style: "bars"
      height: 16
      smoothness: 80
      sensitivity: 50
      auto_gain: true
      framerate: 30
      freq_min: 500
      freq_max: 12000
      hide_idle: true
      hide_idle_after: 3000
      channels: "stereo"
      mono_option: "average"
      reverse: false
      bars:
        count: 6
        width: 1
        gap: 4
      waves:
        width: 40
      dots:
        count: 16
        size: 1
        gap: 3

  power_menu:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "\u23FB"
      uptime: true
      show_user: false
      blur: false
      blur_background: true
      animation_duration: 120 # Milliseconds
      button_row: 3 # Number of buttons in a row, min 1 max 6
      profile_image_size: 80 # Avatar size in pixels
      buttons:
        restart: ["\uEAD2", "Restart"]
        shutdown: ["\u23FB", "Shut Down"]
        signout: ["\uDB80\uDF43", "Sign out"]
        hibernate: ["\uF28E", "Hibernate"]
        lock: ["\uEA75", "Lock"]
        cancel: ["\uDB81\uDF3A", "Cancel"]
  # --- GlazeWM Workspace Indicator ---
  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      hide_empty_workspaces: true
      hide_if_offline: true

  # --- Clock & Calendar Widget ---
  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%H:%M}<span>{alarm}</span>"
      label_alt: "{%a, %d %b %H:%M}"
      timezones: []
      calendar:
        blur: true
        round_corners: true
        alignment: "center"
        direction: "down"
        extended: false
        show_years: true
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: "toggle_calendar"
        on_middle: "toggle_label"
        on_right: "context_menu"

  # --- Volume Control Widget ---
  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span>{level}"
      tooltip: true
      icons:
        muted: "\uE74F"
        "5": "\uE995"
        "10": "\uE995"
        "20": "\uE995"
        "50": "\uE995"
        "100": "\uE995"
      callbacks:
        on_left: "toggle_volume_menu"
        on_right: "toggle_mute"
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "center"
        direction: "down"
        show_apps: true
        show_app_labels: false
        show_app_icons: true
        show_apps_expanded: false
        app_icons:
          toggle_down: "\uE972"
          toggle_up: "\uE971"

  # --- Battery Level Widget ---
  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "<span>{icon}</span> {percent}%"
      label_alt: "<span>{icon}</span> {percent}% | {power}W | {time_remaining}"
      update_interval: 5000
      time_remaining_natural: false
      hide_unsupported: true
      charging_options:
        icon_format: "{charging_icon}"
        blink_charging_icon: true
        blink_interval: 500
      status_thresholds:
        critical: 10
        low: 25
        medium: 75
        high: 95
        full: 100
      status_icons:
        icon_charging: "\uF241"
        icon_critical: "\uF244"
        icon_low: "\uF243"
        icon_medium: "\uF242"
        icon_high: "\uF241"
        icon_full: "\uF240"

  # --- System Tray Widget ---
  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: "\uE972"
      label_expanded: "\uE971"
      label_position: "right"
      pin_click_modifier: "ctrl"
      show_unpinned: true
      show_battery: false
      show_volume: false
      icon_size: 16
      use_hook: false
      show_in_popup: true
      icons_per_row: 5
      popup:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0

  # --- OpenMeteo Weather Widget ---
  open_meteo:
    type: "yasb.open_meteo.OpenMeteoWidget"
    options:
      label: "<span>\uE706</span>"
      label_alt: "<span>\uE706</span> Current {temp}, Min {min_temp}, Max {max_temp}"
      tooltip: true
      update_interval: 600
      hide_decimal: true
      units: "metric"
      callbacks:
        on_left: "toggle_card"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      icons:
        sunnyDay: "\uE706"
        clearNight: "\uEC46"
      weather_card:
        blur: true
        alignment: "left"
        border_color: "system"
        direction: "down"
        icon_size: 32
        show_hourly_forecast: true
        time_format: "24h"
        hourly_point_spacing: 76
        hourly_icon_size: 16
        icon_smoothing: true
        temp_line_width: 2
        current_line_color: "#8EAEE8"
        current_line_width: 1
        current_line_style: "dot"
        hourly_forecast_buttons:
          enabled: false
        weather_animation:
          enabled: true
          snow_overrides_rain: true
          temp_line_animation_style: "both"
          rain_effect_intensity: 1.0
          snow_effect_intensity: 1.0
          scale_with_chance: true

